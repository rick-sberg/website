<!DOCTYPE html>
<html lang="de">

    <head>
        <meta charset="UTF=8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Website</title>
    </head>
    
    <body>
        
        <div class="custom-cursor">&#9733</div>

        <canvas id="cursor-canvas"></canvas>

        <div class="brand">
            <span class="crs-btn" id="crs-button" role="button" tabindex="0">
                CRS
            </span>
        </div>

        <nav class="navigation">
            <span class="menu-btn" id="menu-button" role="button" tabindex="0">
                MENU
            </span>

            <div class="menu-dropdown" id="menu-dropdown">
                <div class="menu-line">
                </div>

                <!-- Die drei neuen Buttons als Spans -->
                <span class="sub-btn" role="button" tabindex="0">
                    work
                </span>
                <span class="sub-btn" role="button" tabindex="0">
                    blog
                </span>
                <span class="sub-btn" role="button" tabindex="0">
                    contact
                </span>
            </div>            
        </nav>

        <div class="work-gallery" id="work-gallery">

            <div class="gallery-content"> 
                
                <div class="gallery-header">
                    <div class="close-btn" id="gallery-close" role="button" tabindex="0">
                        <div class="close-icon">
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                    
                    <div class="filter-menu-container" id="filter-menu-container">
                        <!-- Haupt-Trigger -->
                         <span class="filter-btn" id="filter-button" role="button" tabindex="0"> 
                            filter 
                        </span>

                        <!-- filter-Optionen -->
                        <div class="filter-options" id="filter-options">

                            <!-- Gruppe 1: Zeit -->
                            <span class="filter-opt" data-type="recency" data-value="recent"> recent </span>
                            <!-- <span class="filter-divider"> / </span> -->
                            <span class="filter-opt active" data-type="recency" data-value="all"> all </span>

                            <span class="filter-group-divider"> | </span>

                            <!-- Gruppe 2: Kategorie --> 
                            <span class="filter-opt" data-type="category" data-value="architecture"> architecture </span>
                            <!-- <span class="filter-divider"> / </span> -->
                            <span class="filter-opt" data-type="category" data-value="design"> design </span>
                            <!-- <span class="filter-divider"> / </span> -->
                            <span class="filter-opt" data-type="category" data-value="painting"> painting </span>
                            <!-- <span class="filter-divider"> / </span> -->
                            <span class="filter-opt" data-type="category" data-value="essay"> essay </span>
                            <!-- <span class="filter-divider"> / </span> -->
                            <span class="filter-opt active" data-type="category" data-value="all"> all </span>

                            <span class="filter-group-divider"> | </span>

                            <!-- Gruppe 3: Urheber -->   
                            <span class="filter-opt" data-type="author" data-value="collaborative"> collaborative </span>
                            <!-- <span class="filter-divider"> / </span> -->
                            <span class="filter-opt active" data-type="author" data-value="all"> all </span>
                                                
                        </div>
                    </div>

                    
                </div>
                
                <div class="gallery-columns-container">
                    <div class="gallery-column">
                        <div class="gallery-item" data-recency="recent" data-category="architecture" data-author="collaborative"><img src="bilder/bild1.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="all" data-category="design" data-author="personal"><img src="bilder/bild2.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="painting" data-author="personal"><img src="bilder/bild3.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="all" data-category="essay" data-author="collaborative"><img src="bilder/bild4.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="architecture" data-author="personal"><img src="bilder/bild5.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="all" data-category="design" data-author="collaborative"><img src="bilder/bild6.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="painting" data-author="collaborative"><img src="bilder/bild7.jpeg" alt="Work 1"></div>
                    </div>

                    <div class="gallery-column">
                        <div class="gallery-item" data-recency="all" data-category="essay" data-author="personal"><img src="bilder/bild8.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="architecture" data-author="collaborative"><img src="bilder/bild9.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="all" data-category="design" data-author="personal"><img src="bilder/bild10.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="painting" data-author="collaborative"><img src="bilder/bild11.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="all" data-category="essay" data-author="collaborative"><img src="bilder/bild12.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="architecture" data-author="personal"><img src="bilder/bild13.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="all" data-category="design" data-author="collaborative"><img src="bilder/bild14.jpeg" alt="Work 1"></div>
                    </div>

                    <div class="gallery-column">
                        <div class="gallery-item" data-recency="recent" data-category="painting" data-author="personal"><img src="bilder/bild15.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="essay" data-author="collaborative"><img src="bilder/bild16.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="architecture" data-author="collaborative"><img src="bilder/bild17.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="all" data-category="design" data-author="personal"><img src="bilder/bild18.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="recent" data-category="painting" data-author="collaborative"><img src="bilder/bild19.jpeg" alt="Work 1"></div>
                        <div class="gallery-item" data-recency="all" data-category="essay" data-author="personal"><img src="bilder/bild20.jpeg" alt="Work 1"></div>
                    </div>
                </div>
            </div>
        </div>
   
        <script src="script.js">
        </script>
    </body>
</html>
